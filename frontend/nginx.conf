server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Il frontend fa da proxy verso il backend: nessun problema di CORS.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;          # necessario per lo streaming SSE
    proxy_cache off;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri /index.html;
  }
}
