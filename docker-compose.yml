services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      CHROMA_PATH: /data/chroma
    volumes:
      - chroma_data:/data/chroma   # il database vettoriale sopravvive ai riavvii
    ports:
      - "8000:8000"                # opzionale: utile per /docs (Swagger) in sviluppo
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [mycology]

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    networks: [mycology]

networks:
  mycology:

volumes:
  chroma_data:
